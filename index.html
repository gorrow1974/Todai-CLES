<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word World TED UI</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6faf4;color:#122017;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:940px;margin:auto;padding:16px 14px 90px}.logo{font-size:28px;font-weight:1000;color:#174a2b}.logo small{display:block;font-size:14px;color:#334155}.source{background:linear-gradient(#10466f,#062d50);color:white;border-radius:18px;padding:16px;margin:12px 0}.source h1{margin:0;font-size:24px}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.tab{border:0;border-radius:14px;padding:11px 4px;background:#e8eef4;font-weight:1000}.active{background:#fb7c13!important;color:white}.main{display:grid;grid-template-columns:38% 1fr;gap:16px}.card{background:white;border:1px solid #dce7da;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 10px 26px #0001}.badge{display:inline-block;border-radius:999px;background:#eaf6ea;color:#166534;padding:7px 11px;font-weight:1000;font-size:12px;margin:3px}.prompt{font-size:25px;font-weight:1000;line-height:1.25;color:#0f3d25;white-space:pre-line}.question{font-size:22px;font-weight:1000;margin:10px 0}.timer{background:#f8fafc;border:1px solid #dbe3df;border-radius:16px;padding:12px;margin-top:12px}.timerTop{display:flex;justify-content:space-between;align-items:center;font-weight:1000}.timerTop b{font-size:32px;color:#fb7c13}.barOut{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:8px}.bar{height:100%;width:100%;background:#fb7c13}.choices{display:grid;gap:10px}.choice{border:2px solid #d8e7f7;border-radius:16px;background:#f8fbff;padding:14px;text-align:left;font-size:17px;font-weight:1000}.correct{background:#dcfce7!important;border-color:#22c55e!important;color:#166534}.wrong{background:#fee2e2!important;border-color:#ef4444!important;color:#991b1b}.arrow{white-space:pre-line;text-align:center;background:#f8fff9;border:1px solid #cfe8d2;border-radius:16px;padding:14px;font-size:20px;font-weight:1000;margin-top:10px}.note{background:#fff8e7;border:2px solid #f2c878;border-radius:16px;padding:12px;font-weight:900;margin-top:10px}.result{display:none}.show{display:block}.dash{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:#07345b;color:white;border-radius:16px;padding:12px;margin-top:12px}.big{font-size:25px;font-weight:1000}.lbl{font-size:12px;color:#d5e9f7;font-weight:900}.footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#f6faf4 25%);padding:28px 14px 12px}.nav{max-width:940px;margin:auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.nav button{border:0;border-radius:20px;padding:14px;font-weight:1000;font-size:16px}.primary{background:#174a2b;color:white}.secondary{background:#e5e7eb}@media(max-width:720px){.main{grid-template-columns:1fr}.tabs{grid-template-columns:repeat(3,1fr)}.dash{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="app"><div class="logo">🌏 Word World<small>TED Lv01〜Lv06 UI Sample</small></div><section class="source"><h1 id="title"></h1><p>テーマ：AIは世界を良くするのか、危険なのか。単語から概念、構造、意図へ。</p></section><div class="tabs" id="tabs"></div><div class="main"><section class="card"><div id="levelBadge"></div><div class="prompt" id="prompt"></div><div class="timer"><div class="timerTop"><span>認識時間</span><span><b id="remain">15.0</b> 秒</span></div><div class="barOut"><div class="bar" id="bar"></div></div></div></section><section class="card"><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="result" id="result"><div class="arrow" id="arrow"></div><div class="note" id="note"></div></div></section></div><div class="dash"><div><div class="big" id="attempts">0</div><div class="lbl">試行回数</div></div><div><div class="big" id="rate">0%</div><div class="lbl">正答率</div></div><div><div class="big" id="best">-</div><div class="lbl">最速</div></div><div><div class="big" id="avg">-</div><div class="lbl">平均</div></div></div></div><div class="footer"><div class="nav"><button class="secondary" id="known">知ってる</button><button class="secondary" id="unknown">知らない</button><button class="primary" id="next">次へ</button></div></div><script>
let DATA,lv=0,logs=[],timer=null,t0=0,limit=15;const E=x=>document.getElementById(x);fetch('ted_lv_sample.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{DATA=d;logs=JSON.parse(localStorage.ww_ted_logs||'[]');init();render();dash()});function init(){E('title').textContent=DATA.title;DATA.levels.forEach((x,i)=>{let b=document.createElement('button');b.className='tab';b.textContent=x[0];b.onclick=()=>{lv=i;render()};E('tabs').appendChild(b)});E('next').onclick=()=>{lv=(lv+1)%DATA.levels.length;render()};E('known').onclick=()=>quick('YES');E('unknown').onclick=()=>quick('NO')}function render(){let x=DATA.levels[lv];[...document.querySelectorAll('.tab')].forEach((b,i)=>b.classList.toggle('active',i===lv));E('levelBadge').innerHTML='<span class="badge">'+x[0]+'</span><span class="badge">'+x[1]+'</span><span class="badge">目標 '+x[6]+'</span>';E('prompt').textContent=x[2];E('question').textContent=x[3];E('choices').innerHTML='';x[4].forEach(c=>{let b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>choose(c,b);E('choices').appendChild(b)});E('result').classList.remove('show');start()}function start(){if(timer)clearInterval(timer);t0=Date.now();timer=setInterval(()=>{let s=(Date.now()-t0)/1000,r=Math.max(0,limit-s),p=Math.max(0,r/limit*100);E('remain').textContent=r.toFixed(1);E('bar').style.width=p+'%';E('bar').style.background=p>50?'#fb7c13':p>20?'#facc15':'#ef4444';if(r<=0)clearInterval(timer)},100)}function finish(){let s=(Date.now()-t0)/1000;if(timer)clearInterval(timer);return +s.toFixed(2)}function quick(resp){let sec=finish(),x=DATA.levels[lv];logs.push({level:x[0],response:resp,responseTimeSec:sec,timestamp:new Date().toISOString(),prompt:x[2],quick:true});save();dash()}function choose(c,btn){let x=DATA.levels[lv],sec=finish(),answer=x[4][0],ok=c===answer;[...E('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===answer)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');logs.push({level:x[0],response:c,accuracy:ok,responseTimeSec:sec,timestamp:new Date().toISOString(),prompt:x[2]});E('arrow').textContent=x[5];E('note').textContent=(ok?'OK。':'もう一歩。')+' '+x[7];E('result').classList.add('show');save();dash()}function save(){localStorage.ww_ted_logs=JSON.stringify(logs)}function dash(){let acc=logs.filter(x=>x.accuracy===true).length,total=logs.filter(x=>'accuracy' in x).length,ts=logs.map(x=>x.responseTimeSec).filter(x=>typeof x==='number');E('attempts').textContent=logs.length;E('rate').textContent=total?Math.round(acc/total*100)+'%':'0%';E('best').textContent=ts.length?Math.min(...ts).toFixed(2)+'秒':'-';E('avg').textContent=ts.length?(ts.reduce((a,b)=>a+b,0)/ts.length).toFixed(2)+'秒':'-'}</script></body></html>
